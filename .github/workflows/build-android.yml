name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Laravel 后端地址（手机可访问的 https://域名 或 http://LAN_IP:8000）'
        required: false
        default: 'https://dorm.fnwork.top'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set server URL & sync Capacitor
        run: |
          export CAP_SERVER_URL="${{ github.event.inputs.server_url || 'https://dorm.fnwork.top' }}"
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages (API 36 编译 / build-tools 35)
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Gradle 8.14.3
        run: |
          GRADLE_VERSION=8.14.3
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q -d "$HOME/gradle" /tmp/gradle.zip
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dorm-app-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
